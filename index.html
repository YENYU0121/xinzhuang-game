<script>
// 修正後的 11 個新莊文化與生活聲音景點題庫（11隨機抽8題，修正語法錯誤）
const spotsData = [
    { id: 1, name: "地藏庵（官將首）", audio: "新莊大眾廟官將首.mp3", info: "新莊地藏庵（大眾廟）奉祀地藏王菩薩與大眾爺。其創始的「官將首」陣頭與文武大眾爺祭典（新莊大拜拜），是新莊最具代表性的無形文化資產。" },
    { id: 2, name: "新北市鼓藝節", audio: "响仁和.m4a", info: "新莊傳承百年的製鼓工藝享譽國際，每年由新北市鼓藝節發揚光大。那一聲聲厚實沉穩的震撼鼓響，敲出了在地傳統工藝的驕傲。" },
    { id: 3, name: "新莊戲館巷", audio: "花博-新西園布袋戲 .mp3", info: "新莊廟街 359 巷曾被譽為「戲館巷」，昔日布袋戲、南管、北管劇團在此齊聚。緊湊的鑼鼓點搭配生動口白，傳承了掌中戲的輝煌歲月。" },
    { id: 4, name: "新莊廣福宮", audio: "廣福宮介紹二版.mp3", info: "廣福宮（舊稱三山國王廟）是新莊唯一的國定古蹟，建築完整保留古樸的客家風格，沒有過多華麗彩繪，散發沉靜的客家開墾歷史感。" },
    { id: 5, name: "日日用打鐵店", audio: "新莊日日用打鐵店.mp3", info: "新莊廟街傳承百年的打鐵店，在機械化時代仍堅持手工淬火與鍛造。當風爐鼓風、紅鐵落砧，鏗鏘有力的打鐵聲見證了常民職人的風骨。" },
    { id: 6, name: "新莊廟街夜市", audio: "新莊廟街夜市 (1).mp3", info: "廟街白天是古蹟密布的文史老街，晚上則是傳統叫賣與美食攤販齊聚、人潮喧鬧的在地夜市，展現新莊熱鬧的庶民生活感。" },
    { id: 7, name: "中港大排", audio: "中港大排2.mp3", info: "中港大排歷經綠化整治，從黑水溝華麗轉身為現代親水公園。走在幸福路上能聽見淙淙流水的療癒環境音，是新莊都市之肺。" },
    { id: 8, name: "輔仁大學(淨心堂)", audio: "輔仁大學_彌撒聲.mp3", info: "輔仁大學淨心堂為校園內核心的天主教精神建築，其莊嚴的彌撒鐘聲與平靜氛圍，展現校園獨特的宗教文史與西方禮儀文化融合。" },
    { id: 9, name: "捷運新莊站", audio: "捷運橘線聲音.m4a", info: "台北捷運橘線的開通串聯了新莊與大台北生活圈，車廂廣播與進站聲為現代通勤的交響樂。" },
    { id: 10, name: "新莊棒球場", audio: "新莊棒球場.mp3", info: "新莊棒球場是北台灣職棒重鎮，賽季時充滿極具張力的現場應援敲擊樂與球迷吶喊聲。" },
    { id: 11, name: "化成路(異國美食街)", audio: "化成路 蓮花泰式小吃店 音檔.mp3", info: "化成路周邊工廠多，吸引大量東南亞移工進駐，異國餐廳的小吃香氣與點餐聲構築了多元包容文化。" }
];

let prizePool = [
    { name: "媽祖平安符", count: 50 },
    { name: "新莊朝盛飄帶", count: 70 },
    { name: "玻璃杯墊", count: 23 },
    { name: "旅行組", count: 8 },
    { name: "立牌", count: 10 }
];

let targetScore = 8; let activeSpots = []; let finalCorrectCount = 0; let finalPrizeName = "無獎品"; let hasDrawn = false;
const audioListDiv = document.getElementById('audio-list');

function selectMode(count) {
    targetScore = count; document.getElementById('modeModal').style.display = 'none';
    audioListDiv.innerHTML = ""; // 清空上一次的題目

    // 將總共 11 個景點進行隨機洗牌打散
    const shuffled = [...spotsData].sort(() => Math.random() - 0.5);

    if(count === 3) {
        document.getElementById('current-mode-text').innerText = "機制：體驗版 (隨機3題)";
        document.getElementById('score-text').innerText = "已填寫進度：0 / 3 題"; finalPrizeName = "小包餅乾";
        // 體驗版：從 11 個中盲抽前 3 個景點
        activeSpots = shuffled.slice(0, 3);
    } else {
        document.getElementById('current-mode-text').innerText = "機制：達人挑戰版 (11隨機抽8題)";
        document.getElementById('score-text').innerText = "已填寫進度：0 / 8 題"; finalPrizeName = "無獎品"; 
        // 達人挑戰版：實作 11 取 8 隨機出題
        activeSpots = shuffled.slice(0, 8);
    }
    
    // 再次確保出題順序被打散
    const displayOrder = [...activeSpots].sort(() => Math.random() - 0.5);
    renderGame(displayOrder);
}

function renderGame(displayOrder) {
    displayOrder.forEach((spot, index) => {
        const questionName = `🎵 第 ${index + 1} 題`; spot.displayQuestionName = questionName; 
        const qaBlock = document.createElement('div'); qaBlock.className = 'qa-block';
        qaBlock.innerHTML = `
            <span>${questionName}</span><audio controls src="${spot.audio}"></audio>
            <span style="margin-top:4px;">正確地點是？</span>
            <select id="select-${spot.id}" onchange="updateProgress()">
                <option value="">請選擇景點...</option>
                ${spotsData.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
        `;
        audioListDiv.appendChild(qaBlock);
    });
}

function updateProgress() {
    const allSelects = document.querySelectorAll('.qa-block select');
    let filledCount = 0; allSelects.forEach(select => { if(select.value !== "") filledCount++; });
    document.getElementById('score-text').innerText = `已填寫進度：${filledCount} / ${targetScore} 題`;
    if(filledCount === targetScore) document.getElementById('submit-game-btn').style.display = 'block';
}

function submitGame() {
    finalCorrectCount = 0; let reportHtml = "";
    activeSpots.forEach((spot) => {
        const selectElem = document.getElementById(`select-${spot.id}`);
        const userChoose = parseInt(selectElem.value); selectElem.disabled = true; 
        if (userChoose === spot.id) {
            finalCorrectCount++; selectElem.className = 'correct';
            reportHtml += `<div class="report-item"><div class="report-item-header"><span>${spot.displayQuestionName}</span><span class="badge-success">🟢 答對</span></div><div>正確解答：<b>${spot.name}</b></div><div class="analysis-box">📖 ${spot.info}</div></div>`;
        } else {
            selectElem.className = 'wrong';
            const wrongName = spotsData.find(s => s.id === userChoose)?.name || "未選擇";
            reportHtml += `<div class="report-item"><div class="report-item-header"><span>${spot.displayQuestionName}</span><span class="badge-danger">🔴 答錯</span></div><div>您選了：<span style="color:var(--danger-color);">${wrongName}</span> (正確答案：<b>${spot.name}</b>)</div><div class="analysis-box">📖 ${spot.info}</div></div>`;
        }
    });

    document.getElementById('win-score-big').innerText = `${finalCorrectCount} / ${targetScore}`;
    document.getElementById('report-zone').innerHTML = reportHtml;

    const nextBtn = document.querySelector('.close-btn');

    if ((targetScore === 8 && finalCorrectCount === 8) || (targetScore === 3 && finalCorrectCount === 3)) {
        if(targetScore === 8) {
            document.getElementById('win-status-title').innerText = "🎉 完美全對！達到獲獎標準！";
            document.getElementById('gacha-area').style.display = 'block';
            nextBtn.disabled = true;
            nextBtn.innerText = "🔒 請先點擊上方啟動扭蛋抽獎";
            nextBtn.style.opacity = "0.5";
        } else {
            document.getElementById('win-status-title').innerText = "🎉 完美完成挑戰！";
            document.getElementById('gacha-area').style.display = 'none'; 
            finalPrizeName = "小包餅乾";
            nextBtn.disabled = false;
            nextBtn.innerText = "看完解析，前往填寫活動回饋表單";
            nextBtn.style.opacity = "1";
        }
    } else {
        document.getElementById('win-status-title').innerText = "💪 再接再厲！";
        document.getElementById('gacha-area').style.display = 'none'; 
        finalPrizeName = "無獎品";
        nextBtn.disabled = false;
        nextBtn.innerText = "看完解析，前往填寫活動回饋表單";
        nextBtn.style.opacity = "1";
    }
    document.getElementById('winModal').style.display = 'flex';
}

function startDraw() {
    if (hasDrawn) return; hasDrawn = true;
    document.getElementById('gacha-start-btn').disabled = true;
    const ball = document.getElementById('gacha-ball'); ball.classList.add('shake');

    setTimeout(() => {
        ball.classList.remove('shake');
        let availablePrizes = prizePool.filter(p => p.count > 0);
        if (availablePrizes.length === 0) { finalPrizeName = "獎品已全數抽完"; } else {
            let totalAvailable = availablePrizes.reduce((sum, item) => sum + item.count, 0);
            let randomWeight = Math.floor(Math.random() * totalAvailable);
            let currentSum = 0; let selectedPrize = availablePrizes[availablePrizes.length - 1];
            for (let i = 0; i < availablePrizes.length; i++) {
                currentSum += availablePrizes[i].count;
                if (randomWeight < currentSum) { selectedPrize = availablePrizes[i]; break; }
            }
            selectedPrize.count--; finalPrizeName = selectedPrize.name;
        }
        document.getElementById('gacha-status').innerHTML = `🎉 抽中項目：<b>${finalPrizeName}</b>`;
        
        const nextBtn = document.querySelector('.close-btn');
        nextBtn.disabled = false;
        nextBtn.innerText = "解鎖成功！前往填寫活動回饋表單 ➡️";
        nextBtn.style.opacity = "1";
    }, 1200);
}

function openSurveyZone() {
    document.getElementById('winModal').style.display = 'none';
    document.getElementById('survey-section-card').style.display = 'block';
    document.getElementById('survey-section-card').scrollIntoView({ behavior: 'smooth' });
}

function validateSurvey() {
    const q1 = document.querySelector('input[name="q1"]:checked');
    const q2 = document.querySelector('input[name="q2"]:checked');
    const q3 = document.querySelector('input[name="q3"]:checked');
    const q4 = document.querySelector('input[name="q4"]:checked');
    const q5 = document.querySelector('input[name="q5"]:checked');
    const q6 = document.querySelector('input[name="q6"]:checked');
    const q7 = document.querySelector('input[name="q7"]:checked');
    const q8 = document.querySelector('input[name="q8"]:checked');
    const q9 = document.querySelector('input[name="q9"]:checked');
    
    const btn = document.getElementById('submit-survey-btn');
    if(q1 && q2 && q3 && q4 && q5 && q6 && q7 && q8 && q9) {
        btn.disabled = false; btn.innerText = "🚀 提交填寫，開啟核銷明細單"; btn.style.background = "var(--primary-color)";
    } else {
        btn.disabled = true; btn.innerText = "🔒 請完成上述所有的星號必填題"; btn.style.background = "#777";
    }
}

function saveSurveyData() {
    const cleanComment = (id) => document.getElementById(id).value.replace(/,/g, '，').replace(/\n/g, ' ');

    const surveyRecord = {
        timestamp: new Date().toLocaleString(),
        mode: targetScore === 3 ? '體驗版' : '達人版',
        score: `${finalCorrectCount}/${targetScore}`,
        prize: finalPrizeName,
        q1: document.querySelector('input[name="q1"]:checked').value,
        q2: document.querySelector('input[name="q2"]:checked').value,
        q3: document.querySelector('input[name="q3"]:checked').value,
        q4: document.querySelector('input[name="q4"]:checked').value,
        get q5() {
            return document.querySelector('input[name="q5"]:checked').value;
        },
        q6: document.querySelector('input[name="q6"]:checked').value,
        q7: document.querySelector('input[name="q7"]:checked').value,
        q8: document.querySelector('input[name="q8"]:checked').value,
        q9: document.querySelector('input[name="q9"]:checked').value,
        q10: cleanComment('survey-q10'),
        q11: cleanComment('survey-q11')
    };

    let currentData = JSON.parse(localStorage.getItem('xinzhuang_survey_reports')) || [];
    currentData.push(surveyRecord); localStorage.setItem('xinzhuang_survey_reports', JSON.stringify(currentData));

    document.getElementById('survey-section-card').style.display = 'none';
    goToVerification();
}

function goToVerification() {
    const panel = document.getElementById('final-staff-panel');
    const alertBox = document.getElementById('retry-alert-zone');
    const stampBtn = document.getElementById('stamp-execute-btn');
    const prizeCell = document.getElementById('summary-prize');

    document.getElementById('summary-mode').innerText = targetScore === 3 ? '體驗版 (精選 3 個景點)' : '達人挑戰版 (11隨機抽8題)';
    document.getElementById('summary-score').innerText = `${finalCorrectCount} / ${targetScore} 題`;
    
    const isQualified = (targetScore === 3 && finalCorrectCount === 3) || (targetScore === 8 && finalCorrectCount === 8);

    if (isQualified) {
        panel.classList.remove('disabled-panel'); alertBox.style.display = 'none'; stampBtn.style.display = 'block';
        prizeCell.innerText = finalPrizeName; prizeCell.className = "v-value prize-highlight";
    } else {
        panel.classList.add('disabled-panel'); alertBox.style.display = 'block'; stampBtn.style.display = 'none';
        prizeCell.innerText = "❌ 未達兌獎標準"; prizeCell.className = "v-value prize-highlight no-prize";
    }

    panel.style.display = 'block'; panel.scrollIntoView({ behavior: 'smooth' });
}

function applyVerificationStamp() {
    const stamp = document.getElementById('verification-stamp'); stamp.style.display = 'block';
    document.getElementById('stamp-execute-btn').disabled = true;
    document.getElementById('stamp-execute-btn').innerText = "🔒 本單張已成功蓋章銷帳";
    document.getElementById('stamp-execute-btn').style.background = "#777";
    document.getElementById('submit-game-btn').disabled = true;
}
</script>
