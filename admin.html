<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 後台管理系統 - 大使出任務數據統計</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #9E2A2B;
            --secondary-color: #E09F3E;
            --bg-color: #F4F6F8;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --success-color: #2E7D32;
            --warning-color: #ED8936;
            --danger-color: #E53E3E;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 24px; min-height: 100vh; }
        
        /* 安全鎖登入層 */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FFFDF9; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 2px solid var(--secondary-color); text-align: center; max-width: 400px; width: 90%; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #E2E8F0; border-radius: 12px; margin: 18px 0; text-align: center; font-size: 20px; letter-spacing: 6px; outline: none; transition: 0.2s; }
        .login-box input:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(224,159,62,0.2); }
        .login-box button { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
        .login-box button:hover { background: #822223; transform: translateY(-1px); }
        
        /* 後台主容器 */
        .admin-container { max-width: 1200px; margin: 0 auto; display: none; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .admin-header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #CBD5E1; }
        @media (min-width: 768px) { .admin-header { flex-direction: row; justify-content: space-between; align-items: center; } }
        .admin-title h2 { color: var(--primary-color); font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .admin-title p { font-size: 13px; color: #718096; margin-top: 4px; }
        
        .csv-big-btn { background: #2E7D32; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(46,125,50,0.2); transition: 0.2s; }
        .csv-big-btn:hover { background: #1E5322; transform: translateY(-1px); }
        
        /* 指標面板 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 20px; border: 1px solid #E2E8F0; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--primary-color); }
        .stat-card.blue::after { background: #2A6F97; }
        .stat-card.orange::after { background: var(--secondary-color); }
        .stat-card.green::after { background: var(--success-color); }
        
        .stat-icon { width: 56px; height: 56px; border-radius: 14px; background: #FFF5F5; display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--primary-color); }
        .stat-card.blue .stat-icon { background: #EBF8FF; color: #2A6F97; }
        .stat-card.orange .stat-icon { background: #FFFDF5; color: var(--secondary-color); }
        .stat-card.green .stat-icon { background: #E8F5E9; color: var(--success-color); }
        
        .stat-info .num { font-size: 32px; font-weight: 900; color: #1A202C; line-height: 1.1; }
        .stat-info .label { font-size: 13px; color: #718096; font-weight: 600; margin-top: 4px; }

        .main-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-bottom: 25px; }
        @media (min-width: 900px) { .main-grid { grid-template-columns: 1fr 1fr; } }
        
        .section-card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); border: 1px solid #E2E8F0; display: flex; flex-direction: column; }
        .section-card h3 { color: #1A202C; font-size: 16px; font-weight: 800; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #EDF2F7; display: flex; align-items: center; gap: 8px; }
        .section-card h3 i { color: var(--secondary-color); }
        
        .prize-list-wrapper { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
        .prize-row { background: #F8FAFC; padding: 12px 16px; border-radius: 12px; border: 1px solid #E2E8F0; }
        .prize-meta { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        .prize-name { font-size: 14px; color: #1A202C; }
        .prize-qty { color: #4A5568; }
        .progress-bar-bg { width: 100%; height: 12px; background: #E2E8F0; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #48BB78; border-radius: 6px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .stock-danger { animation: pulseDanger 1.5s infinite; background: #FFF5F5; border-color: #FED7D7; }
        .stock-danger .prize-qty { color: var(--danger-color); }
        @keyframes pulseDanger { 0%, 100% { opacity: 1; } 50% { background: #FFEBEB; } }

        .comment-list { max-height: 320px; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: #EDF2F7; padding: 14px; border-radius: 16px 16px 16px 4px; font-size: 13.5px; color: #2D3748; line-height: 1.5; border: 1px solid #E2E8F0; position: relative; }
        .comment-item.suggest { background: #FFFAF0; border-color: #FEEBC8; border-radius: 16px 16px 4px 16px; }
        .comment-meta-info { display: flex; justify-content: space-between; font-size: 11px; color: #718096; margin-top: 6px; border-top: 1px dashed #CBD5E1; padding-top: 4px; }
        
        .chart-container { position: relative; height: 260px; width: 100%; margin: auto 0; }

        /* 👑 後台頁尾專屬專案資訊 */
        .footer-logo-zone { margin: 40px 0 20px 0; text-align: center; width: 100%; }
        .footer-logo-zone img { width: 170px; height: auto; object-fit: contain; opacity: 0.9; margin-bottom: 10px; }
        .footer-text-meta { font-size: 11.5px; color: #718096; line-height: 1.6; font-weight: 600; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <i class="fa-solid fa-shield-halved" style="font-size: 50px; color: var(--primary-color);"></i>
        <h2 style="margin-top:12px; color:var(--primary-color); font-weight:800;">新北文化大使後台</h2>
        <p style="font-size:13px; color:#718096; margin-top:6px;">請輸入工作人員專屬後台安全 PIN 碼</p>
        <input type="password" id="pinInput" placeholder="••••" maxlength="4">
        <button onclick="verifyAdminPin()">認證並開啟儀表板</button>
    </div>
</div>

<div class="admin-container" id="adminContainer">
    <div class="admin-header">
        <div class="admin-title">
            <h2><i class="fa-solid fa-chart-line"></i> 大使出任務 ‧ 數據即時統計</h2>
            <p>※ 本系統採用公用記憶體統計，即時呈現目前攤位設備之發放與問卷進度。</p>
        </div>
        <button class="csv-big-btn" onclick="downloadCSVReport()"><i class="fa-solid fa-file-excel"></i> 匯出完整問卷統計 (CSV)</button>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-users"></i></div><div class="stat-info"><div class="num" id="totalCount">0</div><div class="label">累積參與總人數</div></div></div>
        <div class="stat-card blue"><div class="stat-icon"><i class="fa-solid fa-graduation-cap"></i></div><div class="stat-info"><div class="num" id="mode8Count">0</div><div class="label">挑戰達人版(8題)</div></div></div>
        <div class="stat-card orange"><div class="stat-icon"><i class="fa-solid fa-flag"></i></div><div class="stat-info"><div class="num" id="mode3Count">0</div><div class="label">挑戰體驗版(3題)</div></div></div>
        <div class="stat-card green"><div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div><div class="stat-info"><div class="num" id="fullScoreCount">0</div><div class="label">全對完美通關數</div></div></div>
    </div>

    <div class="main-grid">
        <div class="section-card">
            <h3><i class="fa-solid fa-boxes-stacked"></i> 現場實體獎品剩餘發放情形 (智能警示)</h3>
            <div class="prize-list-wrapper" id="prizeStockZone"></div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-square-poll-vertical"></i> 表單滿意度核心量化數據指標</h3>
            <div class="chart-container"><canvas id="satisfactionChart"></canvas></div>
        </div>
    </div>

    <div class="main-grid">
        <div class="section-card">
            <h3><i class="fa-solid fa-map-location-dot"></i> 參與群眾居住區域比例分佈</h3>
            <div class="chart-container"><canvas id="regionChart"></canvas></div>
        </div>
        <div class="section-card">
            <h3><i class="fa-solid fa-share-nodes"></i> 參與群眾得悉/參與管道比例</h3>
            <div class="chart-container"><canvas id="channelChart"></canvas></div>
        </div>
    </div>

    <div class="main-grid">
        <div class="section-card">
            <h3><i class="fa-solid fa-face-smile-beam"></i> Q10. 最讓群眾感到驚艷或深刻的地方？</h3>
            <div class="comment-list" id="q10Comments"></div>
        </div>
        <div class="section-card">
            <h3><i class="fa-solid fa-comment-medical"></i> Q11. 民眾認為本次活動最需要改善的地方？</h3>
            <div class="comment-list" id="q11Comments"></div>
        </div>
    </div>

    <div class="footer-logo-zone">
        <img src="NTPC Logo-03.png" alt="新北文化大使 Logo">
        <div class="footer-text-meta">
            活動名稱：「大使出任務，解鎖新莊聲」文化探索體驗活動<br>
            計畫名稱：新北市政府文化局 115 年新北市青年推廣文化計畫
        </div>
    </div>
</div>

<script>
const initialStock = { "媽祖平安符": 50, "新莊朝盛飄帶": 70, "玻璃杯墊": 23, "旅行組": 8, "立牌": 10 };

function verifyAdminPin() {
    const pin = document.getElementById('pinInput').value;
    if (pin === "0121") {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminContainer').style.display = 'block';
        loadDashboardData();
    } else {
        alert("❌ 安全密碼錯誤！無權限進入管理系統。");
        document.getElementById('pinInput').value = "";
    }
}

function loadDashboardData() {
    let records = JSON.parse(localStorage.getItem('xinzhuang_survey_reports')) || [];
    
    document.getElementById('totalCount').innerText = records.length;
    let mode8 = records.filter(r => r.mode === '達人版').length;
    let mode3 = records.filter(r => r.mode === '體驗版').length;
    document.getElementById('mode8Count').innerText = mode8;
    document.getElementById('mode3Count').innerText = mode3;
    
    let fullScore = records.filter(r => {
        let scores = r.score.split('/');
        return scores[0] === scores[1];
    }).length;
    document.getElementById('fullScoreCount').innerText = fullScore;

    let currentStock = { ...initialStock };
    let prizeIssuedCount = { "媽祖平安符": 0, "新莊朝盛飄帶": 0, "玻璃杯墊": 0, "旅行組": 0, "立牌": 0 };
    
    records.forEach(r => {
        if (currentStock[r.prize] !== undefined) {
            currentStock[r.prize]--;
            prizeIssuedCount[r.prize]++;
        }
    });

    let prizeHtml = "";
    Object.keys(initialStock).forEach(pName => {
        let total = initialStock[pName];
        let issued = prizeIssuedCount[pName];
        let remain = total - issued < 0 ? 0 : total - issued;
        let percent = Math.floor((remain / total) * 100);
        
        let isDanger = remain <= 4 ? "stock-danger" : "";
        let fillStyle = remain <= 4 ? "background-color: var(--danger-color)" : "background-color: #48BB78";

        prizeHtml += `
            <div class="prize-row ${isDanger}">
                <div class="prize-meta">
                    <span class="prize-name"><b>🎁 ${pName}</b></span>
                    <span class="prize-qty">剩餘 <b>${remain}</b> / 初始 ${total} <span style="font-weight:normal;opacity:0.7;">(已發 ${issued})</span></span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percent}%; ${fillStyle}"></div>
                </div>
            </div>
        `;
    });
    document.getElementById('prizeStockZone').innerHTML = prizeHtml;

    let totalFun = 0, totalRecommend = 0, totalGuide = 0, totalPrizeS = 0;
    records.forEach(r => {
        totalFun += parseInt(r.q6) || 5;
        totalRecommend += parseInt(r.q5) || 10;
        totalGuide += parseInt(r.q8) || 5;
        totalPrizeS += parseInt(r.q9) || 5;
    });
    let avgFun = records.length ? (totalFun / records.length).toFixed(1) : 0;
    let avgRec = records.length ? (totalRecommend / records.length).toFixed(1) : 0;
    let avgGuide = records.length ? (totalGuide / records.length).toFixed(1) : 0;
    let avgPrizeS = records.length ? (totalPrizeS / records.length).toFixed(1) : 0;

    new Chart(document.getElementById('satisfactionChart'), {
        type: 'bar',
        data: {
            labels: ['Q6_內容動線(滿5)', 'Q5_推薦意願(滿10)', 'Q8_學員引導解說(滿5)', 'Q9_週邊贈品(滿5)'],
            datasets: [{
                label: '當前平均回饋得分',
                data: [avgFun, avgRec, avgGuide, avgPrizeS],
                backgroundColor: ['#2A6F97', '#E09F3E', '#9E2A2B', '#3E6B41'],
                borderRadius: 8
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 10 } } }
    });

    let regions = { "新北市新莊區（在地居民）": 0, "新北市其他行政區": 0, "其他縣市": 0, "國際旅客": 0 };
    let channels = { "新北文化大使IG": 0, "親友推薦": 0, "路過": 0, "其他": 0 };
    
    records.forEach(r => {
        if(regions[r.q3] !== undefined) regions[r.q3]++;
        if(channels[r.q4] !== undefined) channels[r.q4]++;
    });

    new Chart(document.getElementById('regionChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(regions),
            datasets: [{ data: Object.values(regions), backgroundColor: ['#2E7D32', '#A3B18A', '#E09F3E', '#DDA15E'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    new Chart(document.getElementById('channelChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(channels),
            datasets: [{ data: Object.values(channels), backgroundColor: ['#9E2A2B', '#E09F3E', '#4A5759', '#778DA9'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    let q10Html = "", q11Html = "";
    records.forEach(r => {
        if (r.q10 && r.q10.trim() !== "") {
            q10Html += `<div class="comment-item"><b>💬 民眾回饋：</b>${r.q10}<div class="comment-meta-info"><span>⏱️ ${r.timestamp}</span><span>答對: ${r.score}</span></div></div>`;
        }
        if (r.q11 && r.q11.trim() !== "") {
            q11Html += `<div class="comment-item suggest"><b>⚠️ 改善建議：</b>${r.q11}<div class="comment-meta-info"><span>⏱️ ${r.timestamp}</span></div></div>`;
        }
    });
    document.getElementById('q10Comments').innerHTML = q10Html || '<div style="color:#A0AEC0;font-size:13px;padding:10px;text-align:center;">暫無印象深刻回饋</div>';
    document.getElementById('q11Comments').innerHTML = q11Html || '<div style="color:#A0AEC0;font-size:13px;padding:10px;text-align:center;">暫無改善建議回饋</div>';
}

function downloadCSVReport() {
    let records = JSON.parse(localStorage.getItem('xinzhuang_survey_reports')) || [];
    if(records.length === 0) { alert("目前尚未有任何填寫紀錄喔！"); return; }
    let csvContent = "\uFEFF";
    csvContent += "填寫時間,遊玩機制,答對題數,獲得獎品,Q1_年齡,Q2_性別,Q3_居住區域,Q4_得悉管道,Q5_推薦親友意願,Q6_內容動線體驗,Q7_文化知識著墨,Q8_大使引導解說態度,Q9_週邊贈品滿意度,Q10_深刻驚艷之處(簡答),Q11_改善建議(簡答)\n";
    records.forEach(r => { 
        csvContent += `${r.timestamp},${r.mode},${r.score},${r.prize},${r.q1},${r.q2},${r.q3},${r.q4},${r.q5},${r.q6},${r.q7},${r.q8},${r.q9},${r.q10},${r.q11}\n`; 
    });
    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a"); link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "新莊聲音地圖_11題回饋表單總統計報表.csv");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
</script>
</body>
</html>
